<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pound + Float · Animation Lab</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    html, body { background: #13111b; color: #f5f3ff; font-size: 16px; }
    main { display: grid; max-width: 52rem; margin: auto; padding: 12px; gap: 12px; }
    h1 { font-size: clamp(1.5rem, 5vw, 2.25rem); }
    p { margin: 4px 0 0; color: #c6bfd3; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button, select { min-height: 44px; padding: 6px 12px; border-radius: 8px; border: 1px solid #827a94; background: #272233; color: inherit; font: inherit; }
    button[aria-pressed="true"] { background: #d7ff53; color: #15121c; }
    label { display: flex; align-items: center; gap: 8px; }
    .scrub { flex: 1 1 190px; }
    input { min-width: 0; width: 100%; height: 44px; accent-color: #d7ff53; }
    #stage { min-width: 0; }
    #stage .anim { width: 100%; max-height: none; }
    @font-face { font-family: Anton; src: url('../assets/fonts/anton.woff'); }
    body { background: radial-gradient(ellipse at top, #302147, #101019 75%); }
    h1 { font-family: Anton, sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: .025em; }
    .kicker { color: #d7ff53; text-transform: uppercase; font-size: .72rem; font-weight: 800; letter-spacing: .18em; }
    #stage { overflow: hidden; border: 1px solid #655074; border-radius: 12px; box-shadow: 0 12px 40px #0006; }
    .beats { display: flex; gap: 6px; margin-top: 10px; }
    .beats span { padding: 5px 12px; background: #292434; border-bottom: 3px solid transparent; font-weight: 800; text-transform: uppercase; font-size: .8rem; }
    .beats span.active { color: #d7ff53; border-color: #d7ff53; background: #3a3540; }
    .controls { padding: 8px; border: 1px solid #44394e; border-radius: 10px; background: #17131ee6; }
    .stepper { display: flex; gap: 6px; }
    .stepper button { padding-inline: 10px; }
    @media (orientation: landscape) and (max-height: 580px) {
      main { max-width: none; grid-template-columns: minmax(0, 1fr) minmax(190px, 30%); align-items: center; }
      #stage { width: 100%; max-width: calc((100svh - 26px) * 4 / 3); justify-self: center; }
      #stage .anim { max-height: calc(100svh - 24px); }
      #stage { grid-area: 1 / 1 / 3; }
      header, .controls { grid-column: 2; }
      header { align-self: end; }
      header h1 { font-size: 1.2rem; line-height: 1.15; }
      header p { font-size: .85rem; }
      .controls { align-self: start; display: grid; grid-template-columns: auto 1fr; }
      #hand, .scrub { grid-column: 1 / -1; }
      .scrub { font-size: .85rem; }
      .beats span { padding: 4px 6px; font-size: .7rem; }
      .stepper { grid-column: 1 / -1; }
    }
    @media (orientation: landscape) and (max-height: 375px) {
      main { gap: 8px; }
      header p { display: none; }
      .kicker { font-size: .58rem; letter-spacing: .08em; white-space: nowrap; }
      .beats { margin-top: 4px; }
      .controls { gap: 5px; padding: 6px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="kicker">Level 03 / Animation Lab</div>
      <h1>Pound + Float</h1>
      <p>Two quick pounds. One slow float. Stay low.</p>
      <div class="beats" aria-label="Pound, pound, float rhythm"><span>Pound</span><span>Pound</span><span>Float</span></div>
    </header>
    <div id="stage"></div>
    <div class="controls">
      <select id="hand" aria-label="Dribbling hand"><option value="left">Left hand</option><option value="right">Right hand</option></select>
      <button id="slow" aria-pressed="false" aria-label="Half speed">½×</button>
      <button id="play">Pause</button>
      <div class="stepper"><button id="previous" aria-label="Previous frame">− Frame</button><button id="next" aria-label="Next frame">+ Frame</button></div>
      <label class="scrub">Position <input id="phase" type="range" min="0" max="1" step="0.001" value="0"></label>
    </div>
  </main>
  <script type="module" src="./pound-float-preview.js"></script>
</body>
</html>
