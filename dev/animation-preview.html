<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>First Handles: animation preview (dev)</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { padding: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .cell h2 { font-size: 1rem; margin: 0 0 6px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .controls button, .controls select { font: inherit; padding: 6px 12px; }
  </style>
</head>
<body>
  <h1>Animation preview (dev only)</h1>
  <div class="controls">
    <button data-phase="intro">Play</button>
    <button data-phase="paused">Freeze</button>
    <select id="jersey">
      <option value="">Purple / gold</option>
      <option value="#C8102E,#F4F4F4">Red / white</option>
      <option value="#141414,#7CB8F2">Black / sky</option>
      <option value="#F4F4F4,#1D4ED8">White / royal</option>
    </select>
    <label>Phase <input id="scrub" type="range" min="0" max="1" step="0.01" value="0"></label>
  </div>
  <div class="grid" id="grid"></div>
  <script type="module">
    import { drillAnimation, mountDrillAnimation } from "../js/components/drillAnimation.js";
    const cases = [
      { hand: "left", view: "mirror" }, { hand: "right", view: "mirror" },
      { hand: "left", view: "true" }, { hand: "right", view: "true" },
    ];
    const grid = document.getElementById("grid");
    const ctls = cases.map((c) => {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.innerHTML = `<h2>${c.hand} hand, ${c.view} view</h2><div class="stage">${drillAnimation({ drill: "one-hand-dribble", number: "23", ...c })}</div>`;
      grid.append(cell);
      const ctl = mountDrillAnimation(cell.querySelector(".stage"));
      ctl.setPhase("intro");
      return ctl;
    });
    window.__ctls = ctls;
    document.querySelectorAll("[data-phase]").forEach((b) =>
      b.addEventListener("click", () => ctls.forEach((c) => c.setPhase(b.dataset.phase))));
    document.getElementById("scrub").addEventListener("input", (e) => {
      ctls.forEach((c) => { c.setPhase("paused"); c._renderAt(+e.target.value); });
    });
    document.getElementById("jersey").addEventListener("change", (e) => {
      const [j, t] = e.target.value.split(",");
      const s = document.documentElement.style;
      if (j) { s.setProperty("--jersey", j); s.setProperty("--jersey-trim", t); }
      else { s.removeProperty("--jersey"); s.removeProperty("--jersey-trim"); }
    });
  </script>
</body>
</html>
