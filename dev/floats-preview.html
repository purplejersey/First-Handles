<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floats · Animation Lab</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    html, body { background: #13111b; color: #f5f3ff; font-size: 16px; }
    main { display: grid; max-width: 52rem; margin: auto; padding: 12px; gap: 12px; }
    h1 { font-size: clamp(1.5rem, 5vw, 2.25rem); }
    p { margin: 4px 0 0; color: #c6bfd3; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button, select { min-height: 44px; padding: 6px 12px; border-radius: 8px; border: 1px solid #827a94; background: #272233; color: inherit; font: inherit; }
    button[aria-pressed="true"] { background: #d7ff53; color: #15121c; }
    label { display: flex; align-items: center; gap: 8px; }
    .scrub { flex: 1 1 190px; }
    input { min-width: 0; width: 100%; height: 44px; accent-color: #d7ff53; }
    #stage { min-width: 0; }
    #stage .anim { width: 100%; max-height: none; }
    @media (orientation: landscape) and (max-height: 580px) {
      main { max-width: none; grid-template-columns: minmax(0, calc((100svh - 24px) * 4 / 3)) minmax(144px, 1fr); align-items: center; }
      #stage { grid-area: 1 / 1 / 3; }
      header, .controls { grid-column: 2; }
      header { align-self: end; }
      header h1 { font-size: 1.2rem; line-height: 1.15; }
      header p { font-size: .85rem; }
      .controls { align-self: start; display: grid; grid-template-columns: auto 1fr; }
      #hand, .scrub { grid-column: 1 / -1; }
      .scrub { font-size: .85rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Floats · Animation Lab</h1>
      <p>Stay low. Let your hand rise with the ball.</p>
    </header>
    <div id="stage"></div>
    <div class="controls">
      <select id="hand" aria-label="Dribbling hand"><option value="left">Left hand</option><option value="right">Right hand</option></select>
      <button id="slow" aria-pressed="false" aria-label="Half speed">½×</button>
      <button id="play">Pause</button>
      <label class="scrub">Position <input id="phase" type="range" min="0" max="1" step="0.001" value="0"></label>
    </div>
  </main>
  <script type="module" src="./floats-preview.js"></script>
</body>
</html>
